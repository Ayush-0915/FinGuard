services:
  finguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finguard-api:local
    container_name: finguard-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${FINGUARD_PORT:-8000}:8000"
    volumes:
      - finguard_reports:/var/lib/finguard/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  finguard_reports:
