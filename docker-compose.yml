services:
  muleguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: muleguard-api:local
    container_name: muleguard-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${MULEGUARD_PORT:-8000}:8000"
    volumes:
      - muleguard_reports:/var/lib/muleguard/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  muleguard_reports:
